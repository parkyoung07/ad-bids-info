name: 24/7 Multi-Channel Procurement Auto-Ingestion (Verification Only)

on:
  schedule:
    # 하루 3회 자동 수집 검증 (한국 시간 06:00, 12:00, 18:00 KST -> UTC 21:00, 03:00, 09:00)
    - cron: '0 21,3,9 * * *'
  workflow_dispatch:

jobs:
  sync-procurements:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 환경 설정
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 5대 채널 수집 파이프라인 가동 (검토대기 격리)
        env:
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node scripts/fetch-all-channels.mjs

      - name: 데이터 무결성 검증
        run: |
          node scripts/verify-all.cjs

