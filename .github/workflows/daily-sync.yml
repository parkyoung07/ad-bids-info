name: 24/7 Multi-Channel Procurement Auto-Ingestion

on:
  schedule:
    # 하루 3회 자동 수집 (한국 시간 06:00, 12:00, 18:00 KST -> UTC 21:00, 03:00, 09:00)
    - cron: '0 21,3,9 * * *'
  workflow_dispatch:

jobs:
  sync-procurements:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 환경 설정
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 5대 채널 수집 파이프라인 가동
        env:
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node scripts/fetch-all-channels.mjs

      - name: 검색 인덱스 갱신
        run: |
          npm install gray-matter
          node scripts/build-search-index.js

      - name: 신규 공고 DB 자동 커밋 & 푸시
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/data/
          git commit -m "chore(data): 5대 발주 채널 실시간 자동 수집 동기화 [skip ci]" || echo "변경 사항 없음"
          git push
