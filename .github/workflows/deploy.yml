name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  schedule:
    # 매일 3회 자동 업데이트 (한국 시간 기준):
    # - 오전 07:15 KST (UTC 22:15)
    # - 낮 12:15 KST (UTC 03:15)
    # - 오후 06:15 KST (UTC 09:15)
    # ※ 정각(0분)은 전 세계 트래픽 몰림으로 GitHub 스케줄이 누락/지연되므로 15분으로 분산
    - cron: '15 22,3,9 * * *'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Generate Posts, Build and Deploy
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Daily AI Blog Post
        run: node scripts/generate-post.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

      - name: Build Static Site with Latest Bids Data
        run: npm run build
        env:
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}

      - name: Commit and Push New Posts & Updated Bids Data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/content/posts/ public/data/bids.json public/data/news.json public/data/meta.json || true
          git commit -m "chore: auto-generate daily blog post, news and update bids data [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Git push skipped"

      - name: Deploy to Cloudflare Pages (Direct Wrangler Upload)
        run: npx wrangler pages deploy out --project-name=ad-bids-info --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
