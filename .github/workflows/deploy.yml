name: Deploy to Cloudflare Pages (Manual Dispatch & Staging Only)

on:
  workflow_dispatch:
    inputs:
      approval_token:
        description: '회장님 명시적 승인 토큰'
        required: true
      target_environment:
        description: '배포 환경 (staging 또는 production)'
        required: true
        default: 'staging'

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Chairman Approval for Production
        if: ${{ github.event.inputs.target_environment == 'production' }}
        run: |
          if [ -z "${{ github.event.inputs.approval_token }}" ]; then
            echo "❌ [배포 차단] 회장님 승인 토큰 없이 운영 배포를 진행할 수 없습니다."
            exit 1
          fi

      - name: Build Static Site
        run: npm run build
        env:
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Deploy to Cloudflare Pages (Staging)
        if: ${{ github.event.inputs.target_environment == 'staging' }}
        run: npx wrangler pages deploy out --project-name=ad-bids-info --branch=staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages (Production)
        if: ${{ github.event.inputs.target_environment == 'production' }}
        run: npx wrangler pages deploy out --project-name=ad-bids-info --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
