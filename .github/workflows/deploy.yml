name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - staging
  workflow_dispatch:
    inputs:
      target_environment:
        description: '배포 환경 선택 (staging / production)'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      owner_approved:
        description: '회장님 명시적 승인 여부 (production 배포 시 true 필수)'
        required: true
        default: false
        type: boolean

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Production 승인 검증
        if: ${{ github.event.inputs.target_environment == 'production' }}
        run: |
          if [ "${{ github.event.inputs.owner_approved }}" != "true" ]; then
            echo "❌ [오류] 회장님의 명시적 승인(owner_approved: true) 없이 Production 배포는 불가합니다."
            exit 1
          fi

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Static Site
        run: npm run build
        env:
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}

      - name: Deploy to Cloudflare Pages (Staging)
        if: ${{ github.ref_name == 'staging' || github.event.inputs.target_environment == 'staging' }}
        run: npx wrangler pages deploy out --project-name=ad-bids-info --branch=staging --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages (Production)
        if: ${{ github.event.inputs.target_environment == 'production' && github.event.inputs.owner_approved == 'true' }}
        run: npx wrangler pages deploy out --project-name=ad-bids-info --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Purge Cloudflare CDN Cache
        if: ${{ github.event.inputs.target_environment == 'production' && github.event.inputs.owner_approved == 'true' }}
        run: |
          ZONE_ID=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones?name=signbidai.com" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" | jq -r '.result[0].id // empty')
          if [ -n "$ZONE_ID" ] && [ "$ZONE_ID" != "null" ]; then
            echo "Purging Cloudflare cache for Zone: $ZONE_ID"
            curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/purge_cache" \
              -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
              -H "Content-Type: application/json" \
              --data '{"purge_everything":true}'
          fi
        continue-on-error: true

      - name: Verify Live Server Status
        run: node scripts/verify-all.cjs

